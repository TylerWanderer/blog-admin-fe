name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run it makes outdated.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Installs exactly what package-lock.json pins; fails if it's out of date.
      - run: npm ci

      - run: npm run lint
      - run: npm run format:check
      - run: npm test

      # The Cognito IDs are only read when the app starts in a browser, so the
      # build needs no real values. Deploys will set them (see .env.example).
      - run: npm run build
